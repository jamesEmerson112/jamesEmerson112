# Renders GitHub profile stats to github-metrics.svg and commits it back to this repo.
# Requires repository secret METRICS_TOKEN: a classic GitHub PAT (no scopes needed for a public-only profile).
name: Metrics
on:
  schedule: [{cron: "0 12 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render classic metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          user: jamesEmerson112
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: America/Los_Angeles
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: "html, css, jupyter notebook"
          plugin_languages_sections: "most-used"
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
